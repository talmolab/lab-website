# Publications — the curated layer.
#
# OpenAlex supplies the metadata and the discovery; THIS FILE decides what appears.
# That is not decoration. The author's OpenAlex record currently holds 69 works, and
# publishing them unfiltered would add ~40 entries that are not publications: twelve
# Figshare "MOESM" supplementary-material stubs, three "Author response:" peer-review
# records, a publisher erratum, Research Square duplicates of papers already listed,
# and conference abstracts. So the overlay is an allowlist.
#
# key           Lab-assigned and PERMANENT. Derived from first author + year of the
#               EARLIEST version, so it does not change when a preprint is published
#               — which is the whole point of not keying on a DOI. (Verified need:
#               MIMIC-MJX has doi: null in OpenAlex, indexed via PubMed only, while
#               sources.yaml tracks its arXiv DOI. One work, two identifiers.)
# published     The version of record. Shown when present.
# preprint      The earlier version. Linked secondarily, never listed separately.
# manual        Everything, for works no API knows about (no DOI at all).
# image         Thumbnail, relative to public/images/ or an absolute URL.
#
# Metadata is NOT duplicated here. Titles, authors, venues and dates come from the
# API at build time; anything written here overrides them.

