name: Member update

# A "Lab member update" issue (.github/ISSUE_TEMPLATE/member.yml) becomes a pull request
# that edits src/content/people/ and src/assets/people/. Editing the issue updates the PR.
# Nothing reaches main or the site until a maintainer merges it.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # The latest edit of an issue wins.
  group: member-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr:
    # Only issues from the form, and only from people with access to the repository:
    # issue text is untrusted input, and this job can push branches.
    if: >-
      contains(github.event.issue.labels.*.name, 'member') &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply the issue
        id: apply
        env:
          # The issue body is passed through the environment and read by the script;
          # it is never interpolated into a shell command.
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/member-from-issue.mjs --summary "$RUNNER_TEMP/summary.md"

      - name: Validate against the content schema
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx astro check 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Open or update the PR
        env:
          SLUG: ${{ steps.apply.outputs.slug }}
          TITLE: ${{ steps.apply.outputs.title }}
        run: |
          BRANCH="member/issue-$ISSUE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/people src/assets/people
          if git diff --cached --quiet; then
            gh issue comment "$ISSUE" --body "Nothing to change: the entry already matches this issue."
            exit 0
          fi
          git commit -m "$TITLE" -m "From #$ISSUE."
          git push --force origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Closes #$ISSUE. Generated by \`.github/workflows/member.yaml\` from the issue form;"
            echo "edit the issue to change it. Check the portrait crop and the bio before merging."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
            gh issue comment "$ISSUE" --body "Updated the pull request: $(gh pr view "$BRANCH" --json url --jq .url)"
          else
            url=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
            gh issue comment "$ISSUE" --body "Opened $url. A maintainer will review it; nothing is published until it is merged."
          fi

      - name: Report a problem on the issue
        if: ${{ failure() }}
        run: |
          {
            if [[ -f "$RUNNER_TEMP/summary.error.md" ]]; then
              cat "$RUNNER_TEMP/summary.error.md"
            else
              echo "The update could not be turned into a pull request. The schema check said:"
              echo
              echo '```'
              tail -n 25 "$RUNNER_TEMP/check.log" 2>/dev/null || echo "(no log)"
              echo '```'
              echo
              echo "Edit the issue to fix it and the check runs again, or ask a maintainer."
            fi
          } > "$RUNNER_TEMP/fail.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/fail.md"
