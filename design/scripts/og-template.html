<!-- OG card template. Rendered by scripts/mkog.py via headless Chrome at exact pixel sizes. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --paper:#f7f9fb; --ground:#101419;
    --ink:#1f2328; --dmink:#e5e8ec;
    --muted:#555b64; --dmmuted:#a7abb1;
    --acc:#2176b3; --accdm:#2a83c4;
    --rule:#dadee3; --dmrule:#272c31;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    display:flex; align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  body.dark{background:var(--ground); color:var(--dmink)}

  .card{display:flex;align-items:center;gap:var(--gap);width:100%;padding:var(--pad)}
  .logo{flex:0 0 auto}
  .logo img{display:block;height:var(--logoh);width:auto}
  .bar{flex:0 0 auto;width:3px;align-self:stretch;background:var(--rule);margin:var(--barm) 0}
  body.dark .bar{background:var(--dmrule)}
  .copy{display:flex;flex-direction:column;gap:var(--cgap);min-width:0}
  .desc{font-size:var(--descs);font-weight:600;line-height:1.16;letter-spacing:-.025em;text-wrap:balance}
  .desc em{font-style:normal;color:var(--acc)}
  body.dark .desc em{color:var(--accdm)}
  .meta{font-size:var(--metas);font-weight:500;line-height:1.4;color:var(--muted)}
  body.dark .meta{color:var(--dmmuted)}
  .url{font-family:"IBM Plex Mono",monospace;font-size:var(--urls);font-weight:500;
       letter-spacing:.02em;color:var(--acc)}
  body.dark .url{color:var(--accdm)}

  /* --- 1200x630 landscape --- */
  body.wide{--pad:76px;--gap:56px;--logoh:330px;--barm:26px;--cgap:22px;
            --descs:52px;--metas:25px;--urls:25px}
  /* --- 1200x1200 square: stack vertically --- */
  body.square{--pad:110px;--gap:56px;--logoh:400px;--cgap:26px;
              --descs:62px;--metas:31px;--urls:31px;
              align-items:center;text-align:center}
  body.square .card{flex-direction:column}
  body.square .bar{display:none}
  body.square .copy{align-items:center}
</style>
<div class="card">
  <div class="logo"><img id="lg" src="lockup.svg" alt=""></div>
  <div class="bar"></div>
  <div class="copy">
    <div class="desc">Computational tools for studying <em>complex biological systems</em></div>
    <div class="meta">Salk Institute for Biological Studies</div>
    <div class="url">talmolab.org</div>
  </div>
</div>
