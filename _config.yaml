### basic settings

# site properties and page defaults
title: Talmo Lab
description: Website for Talmo Pereira's lab at the Salk Institute for Biological Studies.
logo: images/logo.svg
header: images/background.jpg
footer: images/banner.jpg
baseurl: ""

# site social media and other links
links:
  email: talmo@salk.edu
  google-scholar: Talmo Pereira
  github: talmolab
  twitter: talmop
  # instagram: ""
  # youtube: ""

# automatic citations
auto-cite:
  plugins:
    - name: sources
      input:
        - ../_data/sources.yaml
  output: ../_data/citations.yaml

### advanced settings

# default front matter parameters for markdown files
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

# collections
collections:
  members:
    output: true

# sass settings
sass:
  sass_dir: css

# syntax highlighting
highlighter: rouge

# plugins
plugins:
  - jekyll-redirect-from
  # - jekyll-feed
  - jekyll-sitemap
  # - jekyll-github-metadata
  # - jekyll-avatar
  # - jekyll-gist
  # - jekyll-mentions
  # - jekyll-relative-links
  # - jemoji

# jekyll theme
theme: null

# files and folders kept out of the built site
# NOTE: setting `exclude` REPLACES Jekyll's defaults rather than extending them,
# so the default entries are re-listed here. Removing them would start
# publishing Gemfile, vendor/ and friends.
exclude:
  # Jekyll 3.x defaults
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # brand sources and their build output — see design/README.md.
  # public/ is the Astro convention and is not served by Jekyll; it is committed
  # ready for the migration, not for this build.
  - design/
  - public/
  - scratch/
